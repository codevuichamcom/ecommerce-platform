# Day 20 — Grafana Tempo: single-binary, local block storage (dev/load-test).
#
# Nhận trace qua 2 receiver:
#   - zipkin  : để order/product (common-lib export Zipkin format) gửi sang
#               KHÔNG cần đổi dependency Java. Receiver listen 9411 trong
#               container → map host 9412 (vì Zipkin container đã giữ 9411).
#   - otlp    : sẵn sàng cho service tương lai export OTLP trực tiếp.
#
# Storage local (không cần S3/MinIO cho dev) — restart = mất trace cũ, OK
# cho load test ngắn.

server:
  http_listen_port: 3200

distributor:
  receivers:
    zipkin:
    otlp:
      protocols:
        http:
        grpc:

ingester:
  # Flush nhanh để trace xuất hiện trong Grafana gần real-time khi đang chạy
  # load test (mặc định 5m quá lâu cho phiên debug).
  max_block_duration: 30s

compactor:
  compaction:
    block_retention: 1h   # dev: giữ 1h là đủ, tránh phình ổ đĩa

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal

# Cho phép Grafana query metrics-from-traces (service graph) — tiện debug.
metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
overrides:
  metrics_generator_processors: [service-graphs, span-metrics]
