# Day 20 — Prometheus scrape config cho load test.
#
# Service chạy trên HOST (gradle bootRun), không trong Docker → dùng
# host.docker.internal (Linux cần extra_hosts: host-gateway, đã set ở
# docker-compose.observability.yml).
#
# Scrape 5s để load test 3-4 phút có đủ điểm vẽ percentile mượt.

global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: order-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:8086']
        labels:
          service: order-service

  - job_name: product-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:8082']
        labels:
          service: product-service

  # Prometheus tự-scrape để biết scrape có healthy không.
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
