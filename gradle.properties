# ============================================================
#  Gradle JVM + build optimizations
# ============================================================

# JVM cho Gradle daemon — đủ cho monorepo 9 services.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# ✅ Modern Gradle features
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# Daemon — speed up dev rebuild
org.gradle.daemon=true

# Logging — show stack trace khi error
org.gradle.warning.mode=summary

# Kotlin DSL: enable assignment syntax (`set("...")` → `=`)
systemProp.org.gradle.unsafe.kotlin.assignment=true
