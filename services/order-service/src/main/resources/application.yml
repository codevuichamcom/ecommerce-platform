spring:
  application:
    name: order-service

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://localhost:5432/order_db
    username: ecom
    password: ecom
    hikari:
      maximum-pool-size: 20

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: 8086

# Cross-service endpoints (Day 6 sync via RestClient).
# Day 9 sẽ thay inventory bằng Kafka event-driven; cart vẫn sync read.
services:
  cart:
    base-url: "${CART_SERVICE_URL:http://localhost:8085}"
  inventory:
    base-url: "${INVENTORY_SERVICE_URL:http://localhost:8083}"
  product:
    # Day 8 — order-service gọi product-service `/products/{sku}/snapshot`
    # qua cả Feign + HTTP Interface để demo trade-off.
    base-url: "${PRODUCT_SERVICE_URL:http://localhost:8082}"

# Day 8 — Kafka opt-in. Producer + consumer setup ở common-lib KafkaAutoConfiguration.
app:
  kafka:
    enabled: true
    bootstrap-servers: "${KAFKA_BOOTSTRAP:localhost:9092}"
    client-id: order-service
    consumer-group: order-service

# Day 9 — Spring Kafka observation cho trace propagate qua headers tự động.
spring.kafka:
  template:
    observation-enabled: true
  listener:
    observation-enabled: true

# Day 9 — Micrometer Tracing + OTel Zipkin exporter.
# Sampling 1.0 ở dev — production: 0.01-0.1 head-based hoặc tail-based via collector.
management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      # Day 20 — trỏ sang Tempo (cổng 9412) khi load test để xem trace
      # timeline trong Grafana; mặc định vẫn Zipkin 9411 cho dev thường.
      endpoint: "${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}"
  endpoints:
    web:
      exposure:
        # Day 20 — thêm prometheus để Grafana scrape latency/Hikari/JVM.
        include: health,info,metrics,prometheus
  metrics:
    distribution:
      # Day 20 — bật histogram bucket cho http.server.requests → cho phép
      # histogram_quantile() tính P50/P95/P99 phía Prometheus (server-side
      # percentile, gộp nhiều instance — khác client-side percentile của k6).
      # SLO bucket khớp threshold k6 (200ms/500ms).
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 50ms,100ms,200ms,300ms,500ms,1s,2s

# JWT shared secret với auth-service (xem product/inventory-service).
auth:
  jwt:
    secret: "${AUTH_JWT_SECRET:dev-only-jwt-secret-change-me-in-prod-2026-05-04}"
    issuer: "ecom-auth"

logging:
  level:
    com.ecommerce.order: DEBUG
    org.springframework.security: INFO
