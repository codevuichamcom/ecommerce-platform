spring:
  application:
    name: inventory-service

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://localhost:5432/inventory_db
    username: ecom
    password: ecom
    hikari:
      # Concurrency test reserve cùng SKU sẽ retry burst → cần đủ pool.
      maximum-pool-size: 30

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: 8083

# JWT shared secret với auth-service (xem product-service Day 3).
auth:
  jwt:
    secret: "${AUTH_JWT_SECRET:dev-only-jwt-secret-change-me-in-prod-2026-05-04}"
    issuer: "ecom-auth"

logging:
  level:
    com.ecom.inventory: DEBUG
    org.springframework.security: INFO
