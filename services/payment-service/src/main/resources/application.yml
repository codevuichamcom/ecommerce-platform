spring:
  application:
    name: payment-service

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://localhost:5432/payment_db
    username: ecom
    password: ecom
    hikari:
      maximum-pool-size: 20

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: 8087

# Day 10 — Kafka producer publish payment.completed.
app:
  kafka:
    enabled: true
    bootstrap-servers: "${KAFKA_BOOTSTRAP:localhost:9092}"
    client-id: payment-service
    consumer-group: payment-service
  payment:
    # HMAC-SHA256 shared secret với mock gateway. Production: từ Vault/AWS Secrets Manager,
    # rotate hằng quý, per-provider config riêng (VNPay/Momo/ZaloPay khác key).
    callback-secret: "${PAYMENT_CALLBACK_SECRET:dev-only-callback-secret-change-me}"
    # Reject callback nếu timestamp lệch quá ngưỡng → chống replay attack.
    callback-max-skew-seconds: 300

spring.kafka:
  template:
    observation-enabled: true
  listener:
    observation-enabled: true

management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: "${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}"
  endpoints:
    web:
      exposure:
        include: health,info,metrics

auth:
  jwt:
    secret: "${AUTH_JWT_SECRET:dev-only-jwt-secret-change-me-in-prod-2026-05-04}"
    issuer: "ecom-auth"

# Day 12 — mock gateway behavior cho demo CB/Bulkhead.
# Production: thay bằng real gateway client (VNPay/Momo/ZaloPay SDK) + remove block này.
app.gateway.mock:
  failure-rate: "${GATEWAY_MOCK_FAILURE_RATE:0.0}"   # 0.0..1.0 — set 0.8 để demo CB OPEN
  latency-ms:   "${GATEWAY_MOCK_LATENCY_MS:50}"

# Day 12 — Resilience4j cấu hình
# - CircuitBreaker: sliding-window=10, failureRate≥50% → OPEN
#   waitDurationInOpenState=30s → HALF_OPEN, 3 probe call quyết định CLOSED hay OPEN
# - Bulkhead semaphore: maxConcurrent=10; vượt → BulkheadFullException → fallback
# - recordExceptions chỉ GatewayUnavailableException — KHÔNG count BulkheadFullException
#   (Bulkhead full không phải gateway lỗi).
resilience4j:
  circuitbreaker:
    instances:
      paymentGateway:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        recordExceptions:
          - com.ecommerce.payment.gateway.GatewayUnavailableException
  bulkhead:
    instances:
      paymentGateway:
        maxConcurrentCalls: 10
        maxWaitDuration: 0   # fail-fast, không queue → semantic "load shedding"

logging:
  level:
    com.ecommerce.payment: DEBUG
    org.springframework.security: INFO
