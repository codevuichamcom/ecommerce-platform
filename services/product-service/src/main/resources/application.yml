spring:
  application:
    name: product-service

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://localhost:5432/product_db
    username: ecom
    password: ecom

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true

  # Day 15 — Redis cho L2 distributed cache. Reuse instance của cart-service.
  # Lettuce client (mặc định Spring Data Redis) — non-blocking, share single
  # connection an toàn với virtual threads. Jedis pool-per-thread tệ ở VT scale.
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
      lettuce:
        client-name: product-service-l2

  # Day 22 — Elasticsearch 8 cho full-text search. Spring Data ES auto-config
  # bind ElasticsearchOperations + repository tới URI này. Dev: plaintext http,
  # no auth (xpack.security.enabled=false ở docker-compose). PROD: https +
  # api-key/cert + connection-timeout tighten.
  elasticsearch:
    uris: ${ES_URIS:http://localhost:9200}
    connection-timeout: 2s
    socket-timeout: 5s

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        # Day 20 sẽ scrape /actuator/prometheus từ Grafana — pre-wire sẵn.
        include: health,info,prometheus,caches
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: product-service
      tier: catalog

# Day 15 — 2-tier cache config. L1 in-process (Caffeine) + L2 distributed (Redis).
# Tuning rationale:
#   - L1 TTL 60s + max 10k: catalog ~50k product, hot ratio ~20% → 10k đủ hot
#     working set. Caffeine W-TinyLFU eviction near-optimal.
#   - L2 TTL 300s: invalidation explicit qua @CacheEvict; TTL chỉ safety net
#     khi evict miss (vd app crash giữa update). 5min đủ ngắn để stale không
#     kéo dài + đủ dài để hit ratio cao.
#   - Stampede early-expiration window 30s: trong 30s cuối TTL, XFetch refresh
#     sớm với probability tăng → spread compute, chống thundering herd.
app:
  cache:
    l1:
      ttl-seconds: 60
      max-size: 10000
    l2:
      ttl-seconds: 300
      key-prefix: "product-service:cache:"
    stampede:
      early-expiration-window-seconds: 30
      xfetch-beta: 1.0

  # Day 22 — Kafka bật cho sync Postgres → ES (common-lib KafkaAutoConfiguration
  # opt-in). product-service VỪA producer (publish product.upserted/deleted)
  # VỪA consumer (ProductIndexer index vào ES). Tắt (enabled=false) ở môi
  # trường không cần search → ProductService skip publish, write path vẫn chạy.
  kafka:
    enabled: ${KAFKA_ENABLED:true}
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    client-id: product-service
    consumer-group: product-service

# JWT shared secret với auth-service. Day 7 refactor sang JWKS hoặc shared
# common-lib JwtVerifier. KHÔNG để khác secret giữa services — token issue
# bởi auth-service sẽ verify fail ở đây.
auth:
  jwt:
    secret: "${AUTH_JWT_SECRET:dev-only-jwt-secret-change-me-in-prod-2026-05-04}"
    issuer: "ecom-auth"

logging:
  level:
    com.ecom.product: DEBUG
    org.springframework.security: INFO
