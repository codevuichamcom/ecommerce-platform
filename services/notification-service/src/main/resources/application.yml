spring:
  application:
    name: notification-service

  threads:
    virtual:
      enabled: true

  # Day 11: bật servlet để expose /api/v1 + /api/v2 versioning demo endpoints.
  main:
    web-application-type: servlet

  thymeleaf:
    prefix: classpath:/templates/notification/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false   # dev; true ở prod

  data:
    redis:
      host: "${REDIS_HOST:localhost}"
      port: "${REDIS_PORT:6379}"

# Opt-in Kafka (xem common-lib KafkaAutoConfiguration).
app:
  kafka:
    enabled: true
    bootstrap-servers: "${KAFKA_BOOTSTRAP:localhost:9092}"
    client-id: notification-service
    consumer-group: notification-service

  notification:
    dedup-ttl-hours: 24   # Redis SET NX TTL cho idempotency key

spring.kafka:
  template:
    observation-enabled: true
  listener:
    observation-enabled: true

management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: "${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}"
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: 8087

logging:
  level:
    com.ecommerce.notification: DEBUG
    org.springframework.kafka: INFO
