# ============================================================
#  Gradle Version Catalog — single source of truth cho versions
#  Refer trong build.gradle.kts: libs.springBoot, libs.plugins.springBoot, ...
#  Tốt hơn `extra["xxx"]` cũ vì:
#    1. Type-safe accessor (IDE autocomplete)
#    2. Multi-project share không cần copy version
#    3. Renovate / Dependabot hiểu format này
# ============================================================

[versions]
java = "21"

# Spring
spring-boot               = "3.4.5"
spring-dependency-mgmt    = "1.1.7"
spring-cloud              = "2024.0.0"

# Modernity stack
resilience4j              = "2.2.0"
caffeine                  = "3.1.8"
micrometer-tracing        = "1.4.5"
micrometer-otel           = "1.4.5"

# Codegen / boilerplate
mapstruct                 = "1.6.3"
lombok                    = "1.18.36"
lombok-mapstruct-binding  = "0.2.0"

# Auth
jjwt                      = "0.12.6"

# Test
testcontainers            = "1.21.3"
mockito                   = "5.14.2"

[libraries]
# BOMs
spring-cloud-bom    = { module = "org.springframework.cloud:spring-cloud-dependencies", version.ref = "spring-cloud" }
testcontainers-bom  = { module = "org.testcontainers:testcontainers-bom",                version.ref = "testcontainers" }

# Modern HTTP & resilience
resilience4j-spring-boot3        = { module = "io.github.resilience4j:resilience4j-spring-boot3", version.ref = "resilience4j" }
resilience4j-reactor             = { module = "io.github.resilience4j:resilience4j-reactor",      version.ref = "resilience4j" }
caffeine                         = { module = "com.github.ben-manes.caffeine:caffeine",            version.ref = "caffeine" }

# Tracing — modern Sleuth-replacement (Day 9 wires Zipkin exporter)
micrometer-tracing-bridge-otel   = { module = "io.micrometer:micrometer-tracing-bridge-otel",      version.ref = "micrometer-tracing" }
opentelemetry-exporter-otlp      = { module = "io.opentelemetry:opentelemetry-exporter-otlp" }
opentelemetry-exporter-zipkin    = { module = "io.opentelemetry:opentelemetry-exporter-zipkin" }

# Mapping & boilerplate
mapstruct                  = { module = "org.mapstruct:mapstruct",                       version.ref = "mapstruct" }
mapstruct-processor        = { module = "org.mapstruct:mapstruct-processor",             version.ref = "mapstruct" }
lombok                     = { module = "org.projectlombok:lombok",                      version.ref = "lombok" }
lombok-mapstruct-binding   = { module = "org.projectlombok:lombok-mapstruct-binding",    version.ref = "lombok-mapstruct-binding" }

# JWT
jjwt-api      = { module = "io.jsonwebtoken:jjwt-api",     version.ref = "jjwt" }
jjwt-impl     = { module = "io.jsonwebtoken:jjwt-impl",    version.ref = "jjwt" }
jjwt-jackson  = { module = "io.jsonwebtoken:jjwt-jackson", version.ref = "jjwt" }

# Test
testcontainers-postgres   = { module = "org.testcontainers:postgresql" }
testcontainers-kafka      = { module = "org.testcontainers:kafka" }
testcontainers-junit      = { module = "org.testcontainers:junit-jupiter" }

# Spring Boot Testcontainers integration (@ServiceConnection — Boot 3.1+)
spring-boot-testcontainers = { module = "org.springframework.boot:spring-boot-testcontainers" }

[bundles]
testcontainers-default = ["testcontainers-junit", "testcontainers-postgres", "spring-boot-testcontainers"]

[plugins]
spring-boot              = { id = "org.springframework.boot",         version.ref = "spring-boot" }
spring-dependency-mgmt   = { id = "io.spring.dependency-management",  version.ref = "spring-dependency-mgmt" }
